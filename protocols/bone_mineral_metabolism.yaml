# ─────────────────────────────────────────────────────────────────────────────
# Bone Mineral Metabolism (BMM) Protocol
#
# Template tokens in instruction strings:
#   {pth}  {calcium}  {phosphorus}  {vitamin_d_25oh}
#   {paricalcitol_mcg}   {calcitriol_mcg}
#   {cinacalcet_mg}      {etelcalcetide_mg}
#   {paricalcitol_mcg + 2}  — computed new dose
#   {cinacalcet_mg + 30}
# ─────────────────────────────────────────────────────────────────────────────

protocol: bone_mineral_metabolism
version: "1.1"

rules:

  # ── PTH critically elevated ────────────────────────────────────────────────

  - id: BMM-001
    name: "PTH critically elevated (>800) — escalate"
    enabled: true
    urgency: urgent
    logic: AND
    conditions:
      - field: pth
        operator: ">"
        value: 800
    actions:
      - type: escalate
        instruction: >
          PTH {pth} pg/mL — critically elevated. Review active Vitamin D and calcimimetic
          doses. Consider parathyroidectomy referral if refractory.
    rationale: "PTH {pth} pg/mL exceeds the KDIGO 2–9× ULN upper bound for dialysis patients."

  # ── PTH elevated (600–800), calcium safe — increase active Vitamin D ───────

  - id: BMM-002
    name: "PTH elevated — increase paricalcitol (Ca safe)"
    enabled: true
    urgency: routine
    logic: AND
    conditions:
      - field: pth
        operator: between
        value: [600, 800]
      - field: calcium
        operator: "<="
        value: 10.2
      - field: paricalcitol_mcg
        operator: is_not_null
    actions:
      - type: increase_dose
        medication: paricalcitol
        instruction: >
          PTH {pth} pg/mL above target, calcium {calcium} mg/dL safe.
          Increase paricalcitol {paricalcitol_mcg} mcg → {paricalcitol_mcg + 2} mcg per treatment.
    rationale: "PTH above target with safe calcium permits active Vitamin D intensification."

  - id: BMM-002b
    name: "PTH elevated — initiate paricalcitol (none prescribed, Ca safe)"
    enabled: true
    urgency: routine
    logic: AND
    conditions:
      - field: pth
        operator: between
        value: [600, 800]
      - field: calcium
        operator: "<="
        value: 10.2
      - field: paricalcitol_mcg
        operator: is_null
      - field: calcitriol_mcg
        operator: is_null
    actions:
      - type: initiate
        medication: paricalcitol
        instruction: >
          PTH {pth} pg/mL above target, no active Vitamin D on file.
          Initiate paricalcitol 2 mcg per treatment (or calcitriol 0.5 mcg per protocol).
    rationale: "PTH above target with safe calcium and no current active Vitamin D prescribed."

  # ── PTH elevated (600–800) + hypercalcemia — calcimimetic preferred ────────

  - id: BMM-003
    name: "PTH elevated + hypercalcemia — increase cinacalcet"
    enabled: true
    urgency: soon
    logic: AND
    conditions:
      - field: pth
        operator: between
        value: [600, 800]
      - field: calcium
        operator: ">"
        value: 10.2
      - field: cinacalcet_mg
        operator: is_not_null
    actions:
      - type: adjust
        instruction: >
          PTH {pth} pg/mL elevated AND calcium {calcium} mg/dL high.
          Hold or reduce active Vitamin D. Increase cinacalcet
          {cinacalcet_mg} mg/day → {cinacalcet_mg + 30} mg/day.
    rationale: "Active Vitamin D worsens hypercalcemia; calcimimetic lowers both PTH and calcium."

  - id: BMM-003b
    name: "PTH elevated + hypercalcemia — initiate cinacalcet (none prescribed)"
    enabled: true
    urgency: soon
    logic: AND
    conditions:
      - field: pth
        operator: between
        value: [600, 800]
      - field: calcium
        operator: ">"
        value: 10.2
      - field: cinacalcet_mg
        operator: is_null
      - field: etelcalcetide_mg
        operator: is_null
    actions:
      - type: initiate
        medication: cinacalcet
        instruction: >
          PTH {pth} pg/mL elevated AND calcium {calcium} mg/dL high, no calcimimetic prescribed.
          Initiate cinacalcet 30 mg/day (or etelcalcetide per protocol).
          Hold active Vitamin D until calcium returns to ≤10.2 mg/dL.
    rationale: "Active Vitamin D worsens hypercalcemia; calcimimetic is preferred in this scenario."

  # ── PTH over-suppressed — reduce active Vitamin D ─────────────────────────

  - id: BMM-004
    name: "PTH over-suppressed — reduce paricalcitol"
    enabled: true
    urgency: routine
    logic: AND
    conditions:
      - field: pth
        operator: "<"
        value: 150
      - field: calcium
        operator: ">="
        value: 8.4
      - field: paricalcitol_mcg
        operator: is_not_null
    actions:
      - type: decrease_dose
        medication: paricalcitol
        instruction: >
          PTH {pth} pg/mL — over-suppressed (<150), calcium {calcium} mg/dL safe.
          Decrease paricalcitol {paricalcitol_mcg} mcg → {paricalcitol_mcg - 2} mcg per treatment,
          or hold one dose per week if already at minimum.
    rationale: "Adynamic bone disease risk increases with PTH <150 in chronic dialysis patients."

  - id: BMM-004b
    name: "PTH over-suppressed — reduce cinacalcet"
    enabled: true
    urgency: routine
    logic: AND
    conditions:
      - field: pth
        operator: "<"
        value: 150
      - field: calcium
        operator: ">="
        value: 8.4
      - field: cinacalcet_mg
        operator: is_not_null
    actions:
      - type: decrease_dose
        medication: cinacalcet
        instruction: >
          PTH {pth} pg/mL — over-suppressed (<150), on cinacalcet {cinacalcet_mg} mg/day.
          Decrease to {cinacalcet_mg - 30} mg/day, or hold if already at 30 mg/day.
    rationale: "Cinacalcet dose reduction needed to avoid adynamic bone disease."

  # ── PTH over-suppressed + hypocalcemia — hold calcimimetic ────────────────

  - id: BMM-005
    name: "PTH over-suppressed + hypocalcemia — hold cinacalcet"
    enabled: true
    urgency: soon
    logic: AND
    conditions:
      - field: pth
        operator: "<"
        value: 150
      - field: calcium
        operator: "<"
        value: 8.4
      - field: cinacalcet_mg
        operator: is_not_null
    actions:
      - type: hold
        medication: cinacalcet
        instruction: >
          PTH {pth} pg/mL low AND calcium {calcium} mg/dL low — symptomatic hypocalcemia risk.
          Hold cinacalcet (currently {cinacalcet_mg} mg/day). Correct calcium before re-challenging.
    rationale: "Calcimimetics further suppress PTH and worsen hypocalcemia."

  # ── Hypercalcemia — hold active Vitamin D ─────────────────────────────────

  - id: BMM-006a
    name: "Hypercalcemia — hold paricalcitol"
    enabled: true
    urgency: soon
    logic: AND
    conditions:
      - field: calcium
        operator: ">"
        value: 10.2
      - field: paricalcitol_mcg
        operator: is_not_null
    actions:
      - type: hold
        medication: paricalcitol
        instruction: >
          Calcium {calcium} mg/dL — elevated. Hold paricalcitol (currently {paricalcitol_mcg} mcg)
          until calcium returns to ≤10.2 mg/dL. Switch to non-calcium phosphate binder
          if phosphorus management is needed.
    rationale: "Persistent hypercalcemia increases vascular calcification risk."

  - id: BMM-006b
    name: "Hypercalcemia — hold calcitriol"
    enabled: true
    urgency: soon
    logic: AND
    conditions:
      - field: calcium
        operator: ">"
        value: 10.2
      - field: calcitriol_mcg
        operator: is_not_null
    actions:
      - type: hold
        medication: calcitriol
        instruction: >
          Calcium {calcium} mg/dL — elevated. Hold calcitriol (currently {calcitriol_mcg} mcg)
          until calcium returns to ≤10.2 mg/dL.
    rationale: "Active Vitamin D further raises calcium — hold until resolved."

  # ── PTH in target range ────────────────────────────────────────────────────

  - id: BMM-007
    name: "PTH and calcium in target — no change"
    enabled: true
    urgency: monitor
    logic: AND
    conditions:
      - field: pth
        operator: between
        value: [150, 600]
      - field: calcium
        operator: between
        value: [8.4, 10.2]
    actions:
      - type: no_change
        instruction: >
          PTH {pth} pg/mL and calcium {calcium} mg/dL in target range.
          Continue paricalcitol {paricalcitol_mcg} mcg / cinacalcet {cinacalcet_mg} mg/day.
    rationale: "KDIGO target PTH 150–600 pg/mL, calcium 8.4–10.2 mg/dL."

  # ── Nutritional Vitamin D deficiency ──────────────────────────────────────

  - id: BMM-008
    name: "Nutritional Vitamin D deficiency — supplement"
    enabled: true
    urgency: routine
    logic: AND
    conditions:
      - field: vitamin_d_25oh
        operator: "<"
        value: 20
    actions:
      - type: initiate
        medication: cholecalciferol
        instruction: >
          Vitamin D 25-OH {vitamin_d_25oh} ng/mL — deficient (<20).
          Initiate or increase cholecalciferol 2000–4000 IU/day
          (ergocalciferol 50,000 IU/week × 8 weeks if severely deficient).
    rationale: "Nutritional Vitamin D deficiency worsens secondary hyperparathyroidism in ESKD."
