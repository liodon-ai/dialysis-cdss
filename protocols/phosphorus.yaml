# ─────────────────────────────────────────────────────────────────────────────
# Phosphorus Management Protocol
# ─────────────────────────────────────────────────────────────────────────────

protocol: phosphorus
version: "1.0"

rules:

  - id: PHOS-001
    name: "Severely elevated phosphorus — escalate binders"
    enabled: true
    urgency: urgent
    logic: AND
    conditions:
      - field: phosphorus
        operator: ">"
        value: 7.0
    actions:
      - type: escalate
        instruction: "Phosphorus critically elevated (>7.0 mg/dL). Review dietary adherence. Increase phosphate binder dose at all meals and snacks. Consider adding a second class of binder. Urgent dietary counseling."
    rationale: "Phosphorus >7 mg/dL is associated with markedly elevated cardiovascular and mortality risk."

  - id: PHOS-002
    name: "Elevated phosphorus — increase binder dose"
    enabled: true
    urgency: routine
    logic: AND
    conditions:
      - field: phosphorus
        operator: between
        value: [5.5, 7.0]
    actions:
      - type: increase_dose
        medication: phosphate_binder
        instruction: "Phosphorus above target (>5.5 mg/dL). Increase sevelamer/lanthanum/calcium acetate dose by one tablet per meal, or add a dose with largest meal. Reinforce dietary phosphorus restriction."
    rationale: "KDIGO target phosphorus 3.5–5.5 mg/dL for dialysis patients."

  - id: PHOS-003
    name: "Phosphorus in target range — no binder change"
    enabled: true
    urgency: monitor
    logic: AND
    conditions:
      - field: phosphorus
        operator: between
        value: [3.5, 5.5]
    actions:
      - type: no_change
        instruction: "Phosphorus in target range (3.5–5.5 mg/dL). Continue current binder regimen."
    rationale: "Phosphorus within KDIGO target range."

  - id: PHOS-004
    name: "Low phosphorus — reduce or hold binders"
    enabled: true
    urgency: routine
    logic: AND
    conditions:
      - field: phosphorus
        operator: "<"
        value: 3.5
    actions:
      - type: decrease_dose
        medication: phosphate_binder
        instruction: "Phosphorus below target (<3.5 mg/dL). Reduce phosphate binder dose. Hold binders with any meal where patient reports poor appetite. Recheck in 2–4 weeks."
    rationale: "Hypophosphatemia in dialysis patients can cause muscle weakness and bone pain."

  - id: PHOS-005
    name: "High phosphorus with hypercalcemia — avoid calcium binders"
    enabled: true
    urgency: soon
    logic: AND
    conditions:
      - field: phosphorus
        operator: ">"
        value: 5.5
      - field: calcium
        operator: ">"
        value: 10.2
    actions:
      - type: adjust
        instruction: "Phosphorus high AND calcium elevated. Switch from calcium acetate to non-calcium binder (sevelamer or lanthanum). Calcium binders contraindicated in hypercalcemia."
    rationale: "Calcium-based binders worsen hypercalcemia and cardiovascular calcification."
